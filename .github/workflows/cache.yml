name: Build Cache
on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am
  workflow_dispatch:

concurrency:
  group: cache-build
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quantecon/quantecon-build:latest
    
    permissions:
      contents: read
      issues: write
      packages: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: each page's "Last changed" date and changelog come
          # from git log. A shallow clone dates every page to the checkout commit.
          fetch-depth: 0
      
      - name: Build and Cache
        uses: quantecon/actions/build-jupyter-cache@v0
        with:
          builders: 'html'
          source-dir: 'lectures'
          create-issue-on-failure: true
