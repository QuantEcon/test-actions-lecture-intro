name: CI Preview
on: 
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quantecon/quantecon-build:latest
    
    permissions:
      contents: read
      packages: read
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Restore Build Cache
        id: cache
        uses: quantecon/actions/restore-jupyter-cache@v0
        with:
          cache-type: 'build'
          source-dir: 'lectures'
          save-cache: 'true'
      
      - name: Build PDF
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'pdflatex'
          upload-failure-reports: true
      
      - name: Build Notebooks
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'jupyter'
          upload-failure-reports: true
      
      - name: Build HTML
        id: build
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'html'
          html-copy-pdf: true
          html-copy-notebooks: true
          upload-failure-reports: true
      
      # Candidate for QuantEcon/actions#174: the preview actions from that branch,
      # not a release. Cloudflare first, so its result stands on its own.
      - name: Deploy to Cloudflare Pages (candidate, actions#174)
        uses: quantecon/actions/preview-cloudflare@claude/105-preview-deploy
        with:
          build-dir: ${{ steps.build.outputs.build-path }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_QE_ACCOUNT_ID }}
          project-name: qe-preview-canary

      - name: Deploy to Netlify (candidate, actions#174)
        uses: quantecon/actions/preview-netlify@claude/105-preview-deploy
        with:
          build-dir: ${{ steps.build.outputs.build-path }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
