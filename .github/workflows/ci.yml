name: CI Preview
on: 
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quantecon/quantecon-build:latest
    
    permissions:
      contents: read
      packages: read
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Restore Build Cache
        id: cache
        uses: quantecon/actions/restore-jupyter-cache@v0.18.0
        with:
          cache-type: 'build'
          source-dir: 'lectures'
          save-cache: 'true'
      
      - name: Build PDF
        uses: quantecon/actions/build-lectures@v0.18.0
        with:
          source-dir: 'lectures'
          builder: 'pdflatex'
          upload-failure-reports: true
      
      - name: Build Notebooks
        uses: quantecon/actions/build-lectures@v0.18.0
        with:
          source-dir: 'lectures'
          builder: 'jupyter'
          upload-failure-reports: true
      
      - name: Build HTML
        id: build
        uses: quantecon/actions/build-lectures@v0.18.0
        with:
          source-dir: 'lectures'
          builder: 'html'
          html-copy-pdf: true
          html-copy-notebooks: true
          upload-failure-reports: true
      
      # preview-cloudflare runs on every canary PR next to preview-netlify, so a
      # release staged here (QuantEcon/actions CONTRIBUTING.md, Staged Releases)
      # exercises both preview providers. Project: qe-preview-canary.
      - name: Deploy to Cloudflare Pages
        uses: quantecon/actions/preview-cloudflare@v0.18.0
        with:
          build-dir: ${{ steps.build.outputs.build-path }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_QE_ACCOUNT_ID }}
          project-name: qe-preview-canary
      
      - name: Deploy to Netlify
        uses: quantecon/actions/preview-netlify@v0.18.0
        with:
          build-dir: ${{ steps.build.outputs.build-path }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
