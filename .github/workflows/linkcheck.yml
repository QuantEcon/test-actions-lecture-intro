name: Link Checker [Anaconda, Linux]
on:
  schedule:
    # UTC 23:00 is early morning in Australia (9am) -- runs weekly on Sunday
    - cron:  '0 23 * * 0'
  workflow_dispatch:
jobs:
  link-checking:
    name: Link Checking
    # SPIKE BRANCH ONLY (QuantEcon/actions#143): never merge spike/143-local-uses.
    # A dispatch at this branch would file a Link Checker Report issue
    # (issues: write); skip it here. Harmless elsewhere.
    if: github.ref_name != 'spike/143-local-uses'
    runs-on: "ubuntu-latest"
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      # Checkout the live site (html)
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: --accept 403,503 *.html
      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue, linkchecker