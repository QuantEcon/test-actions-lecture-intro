# The release gate's fixture (QuantEcon/actions#136). gate.yml builds it with
# QuantEcon/actions checked out at a candidate commit (#135); ../README.md says
# what it is for and the rules it keeps.
#
# Nothing here may read the network at build time, so a red gate means the
# candidate and not a moved server: no intersphinx, no remote redirects, no
# bibliography, no remote data. A URL is only ever a link.
title: "Release gate fixture"
author: QuantEcon
logo: ""

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath

only_build_toc_files: true
execute:
  # As the lecture sites have it. The gate's cache job builds with nothing
  # restored, so every page executes there; its site jobs restore that run's
  # cache, as consumers do, and execute nothing.
  execute_notebooks: "cache"
  timeout: 300

latex:
  latex_documents:
    targetname: gate.tex
  # No latex_engine: jupyter-book's default, pdflatex, is what seven of the
  # eight lecture sites build with. The container smoke test covers xelatex.

sphinx:
  # sphinx_tojupyter is the jupyter builder that build-lectures runs.
  extra_extensions: [sphinx_tojupyter]
  config:
    html_theme: quantecon_book_theme
    tojupyter_static_file_path: ["_static"]
    tojupyter_target_html: true
    tojupyter_urlpath: "https://quantecon.github.io/test-actions-lecture-intro/"
    tojupyter_image_urlpath: "https://quantecon.github.io/test-actions-lecture-intro/_static/"
    tojupyter_lang_synonyms: ["ipython", "ipython3", "python"]
    tojupyter_kernels:
      python3:
        kernelspec:
          display_name: "Python"
          language: python3
          name: python3
        file_extension: ".py"
    tojupyter_images_markdown: true
