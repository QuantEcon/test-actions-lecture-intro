# Trimmed toc — this repo is a CANARY for QuantEcon/actions, not a lecture site.
#
# It carries a deliberately small, stable subset of lecture-python-intro so that
# a red run means an ACTION regression rather than lecture content drift. The
# full book reddened this repo in April 2026 (a cell in inequality.md raised an exception)
# and it stayed red and ignored for months — a canary whose failures are usually
# not about the thing it tests is a canary nobody reads.
#
# Selection criteria, applied mechanically over all 50 lectures:
#   - no network access at build time (no remote read_csv, wbgapi, requests)
#   - no heavy/optional imports (statsmodels, sklearn, cvxpy, numba) or pip installs
#   - no local {doc} cross-references (a dangling one is fatal under -W)
#   - no {cite} references
# `only_build_toc_files: true` in _config.yml means the other lectures stay on
# disk but are not built. To restore the full book, see git history for this file.
#
# Between them these five exercise: matplotlib figures, numpy linear algebra,
# scipy/random sampling, iterative dynamics, LaTeX-heavy math (the pdflatex
# builder), and static `_static/` figure copying (short_path).
format: jb-book
root: intro
parts:
- caption: Canary lectures
  numbered: true
  chapters:
  - file: geom_series
  - file: short_path
  - file: lln_clt
  - file: solow
  - file: linear_equations
- caption: Other
  numbered: true
  chapters:
  - file: zreferences
